<nav class="w-14 md:w-52 h-full flex flex-col gap-1 p-2 border-r border-white/10 bg-[#111]">
  <div class="px-3 py-4 mb-2 text-lg font-bold hidden md:block text-white/80">
    🏠 Home AI
  </div>
  @for (item of navItems; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="bg-white/10 text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 transition text-white/60 hover:text-white"
    >
      <span class="text-xl">{{ item.icon }}</span>
      <span class="hidden md:block text-sm font-medium">{{ item.label }}</span>
    </a>
  }
</nav>
